---
# ClusterIP. YARP is the only thing that talks to this — see yarp-config's services__grpc__http__0.
apiVersion: "v1"
kind: "Service"
metadata:
  name: "grpc-service"
  labels:
    app.kubernetes.io/name: "accounting-app"
    app.kubernetes.io/component: "grpc"
    app.kubernetes.io/instance: "{{.Release.Name}}"
spec:
  type: "ClusterIP"
  selector:
    app.kubernetes.io/name: "accounting-app"
    app.kubernetes.io/component: "grpc"
    app.kubernetes.io/instance: "{{.Release.Name}}"
  ports:
    - name: "http"
      protocol: "TCP"
      port: {{ .Values.parameters.grpc.port_http }}
      targetPort: {{ .Values.parameters.grpc.port_http }}
