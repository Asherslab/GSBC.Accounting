---
# Runs the EF Core migrations, then exits. A Helm hook rather than an ordinary manifest, so it runs
# once per release and completes before Helm calls the upgrade done.
#
# `before-hook-creation` deletes the previous Job first. Without it the second upgrade fails: a
# completed Job's pod template is immutable, so Kubernetes rejects the apply rather than re-running it.
apiVersion: "batch/v1"
kind: "Job"
metadata:
  name: "migrations-job"
  labels:
    app.kubernetes.io/name: "accounting-app"
    app.kubernetes.io/component: "migrations"
    app.kubernetes.io/instance: "{{.Release.Name}}"
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "accounting-app"
        app.kubernetes.io/component: "migrations"
        app.kubernetes.io/instance: "{{.Release.Name}}"
    spec:
      restartPolicy: Never
      containers:
        - image: "{{ .Values.parameters.migrations.migrations_image }}:{{ .Values.image_tag }}"
          name: "migrations"
          envFrom:
            - configMapRef:
                name: "migrations-config"
            # ConnectionStrings__accounting. Created out of band with kubectl.
            - secretRef:
                name: "migrations-secrets"
          imagePullPolicy: "IfNotPresent"
