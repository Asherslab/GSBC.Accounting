---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "sql-data-pvc"
  labels:
    app.kubernetes.io/name: "accounting-app"
    app.kubernetes.io/component: "sql"
    app.kubernetes.io/instance: "{{.Release.Name}}"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      # Rows only. The receipts are in the object store, not in a bytea column — see
      # docs/modules/expenses/attachments.md. A submission is a few kilobytes of text and money, and
      # nothing is ever deleted inside seven years, so this is generous.
      storage: "{{ .Values.parameters.sql.storage }}"
