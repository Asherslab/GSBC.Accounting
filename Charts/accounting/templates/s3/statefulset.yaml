---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "s3-statefulset"
  labels:
    app.kubernetes.io/name: "accounting-app"
    app.kubernetes.io/component: "s3"
    app.kubernetes.io/instance: "{{.Release.Name}}"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "accounting-app"
        app.kubernetes.io/component: "s3"
        app.kubernetes.io/instance: "{{.Release.Name}}"
    spec:
      containers:
        - image: "{{ .Values.parameters.s3.s3_image }}"
          name: "s3"
          # `server` runs master, volume, filer and the S3 gateway in one process. That is the whole
          # point: one small container holding the receipts, not a distributed cluster.
          #
          # This is a SEPARATE SeaweedFS from GSBC.ImpactKids', in a separate namespace, with its own
          # PVC and its own identities. The two deployments share nothing. It was considered and
          # rejected on resource grounds being irrelevant — each instance is tiny, and separate means
          # a credential or a quota problem in one cannot reach the other's data.
          #
          # The three volume flags are not tuning, they are load-bearing. Left at their defaults,
          # `server` allocates volume files of 1 GB each and grows them SEVEN at a time; ImpactKids
          # measured three small objects consuming 7 GB of disk on 2026-08-29. Against the PVC below
          # that is an immediate out-of-space, and the S3 error is a bare `400 InvalidRequest` with
          # the real cause only in this container's log.
          args:
            - "server"
            - "-dir=/data"
            - "-s3"
            - "-s3.port={{ .Values.parameters.s3.port_s3 }}"
            - "-s3.config=/etc/seaweedfs/s3.json"
            - "-master.volumeSizeLimitMB={{ .Values.parameters.s3.volume_size_limit_mb }}"
            - "-master.volumePreallocate=false"
            - "-volume.max={{ .Values.parameters.s3.volume_max }}"
          ports:
            - name: "s3"
              protocol: "TCP"
              containerPort: {{ .Values.parameters.s3.port_s3 }}
          volumeMounts:
            - name: "s3-data"
              mountPath: "/data"
            - name: "s3-identities"
              mountPath: "/etc/seaweedfs"
              readOnly: true
          imagePullPolicy: "IfNotPresent"
      volumes:
        - name: "s3-data"
          persistentVolumeClaim:
            claimName: "s3-data-pvc"
        # Created out of band with kubectl, like sql-secrets — the chart only references it, so no
        # credential is ever rendered from a values file into git. One key, s3.json, holding
        # SeaweedFS' identities document. See docs/modules/infrastructure/deployment.md.
        #
        # Because the chart does not render it, changing it does NOT roll this pod: SeaweedFS reads
        # its identities once at startup and reports nothing either way. Follow an identity change
        # with `kubectl -n accounting rollout restart statefulset/s3-statefulset`.
        - name: "s3-identities"
          secret:
            secretName: "s3-identities-secret"
  selector:
    matchLabels:
      app.kubernetes.io/name: "accounting-app"
      app.kubernetes.io/component: "s3"
      app.kubernetes.io/instance: "{{.Release.Name}}"
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {}
  updateStrategy:
    type: "RollingUpdate"
