---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "s3-data-pvc"
  labels:
    app.kubernetes.io/name: "accounting-app"
    app.kubernetes.io/component: "s3"
    app.kubernetes.io/instance: "{{.Release.Name}}"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      # Smaller than volume_size_limit_mb x volume_max (30 GB), deliberately. That product is a
      # ceiling on what SeaweedFS may ever allocate, not a reservation: with preallocation off, volume
      # files grow only as real bytes arrive, so this claim is the practical limit and the flags exist
      # to stop SeaweedFS grabbing space it is not using. If the store ever approaches this figure,
      # grow the PVC first and only then raise volume_max.
      #
      # Receipts are 1-20 MB and retained seven years. Growing a local-path PVC on k3s is not
      # in-place, so this is sized for the decade rather than the year.
      storage: "{{ .Values.parameters.s3.storage }}"
