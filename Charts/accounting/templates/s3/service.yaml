---
# ClusterIP only, and deliberately so. Nothing outside the cluster reaches the object store: there is
# no Ingress, no TunnelBinding and no YARP route to it. A receipt reaches the browser through the gRPC
# service's /api endpoints or not at all — there are no presigned URLs.
apiVersion: "v1"
kind: "Service"
metadata:
  name: "s3-service"
  labels:
    app.kubernetes.io/name: "accounting-app"
    app.kubernetes.io/component: "s3"
    app.kubernetes.io/instance: "{{.Release.Name}}"
spec:
  type: "ClusterIP"
  selector:
    app.kubernetes.io/name: "accounting-app"
    app.kubernetes.io/component: "s3"
    app.kubernetes.io/instance: "{{.Release.Name}}"
  ports:
    - name: "s3"
      protocol: "TCP"
      port: {{ .Values.parameters.s3.port_s3 }}
      targetPort: {{ .Values.parameters.s3.port_s3 }}
