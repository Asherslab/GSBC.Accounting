# The whole release. One push to master produces a version, four images, a chart, and a commit in
# gsbc.argo that Argo CD picks up — nothing is deployed by hand.
#
# Same shape as GSBC.ImpactKids' workflow of the same name, deliberately, so there is one pipeline to
# understand rather than two. Differences: four images instead of five (no photo-backfill worker), and
# the chart and argo paths name accounting.
name: Docker Build

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  version:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-version reads the tag history to work out the next number. A shallow clone gives
          # it nothing and every run then claims to be the first.
          fetch-depth: 0

      - name: Generate Semantic Version
        id: version
        uses: paulhatch/semantic-version@v5.4.0

      - name: Push Release Tag
        run: |
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

  build-migrations:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # arm64 is not optional: the cluster is a Mac mini. QEMU is what lets an x86 runner produce that
      # half of the manifest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Migrations
        uses: docker/build-push-action@v6
        with:
          file: GSBC.Accounting.Workers.DbMigrations/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=asherslab/gsbc-accounting-migrations:latest
          cache-to: type=inline
          push: true
          tags: asherslab/gsbc-accounting-migrations:latest,asherslab/gsbc-accounting-migrations:${{needs.version.outputs.version}}

  build-grpc:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Grpc
        uses: docker/build-push-action@v6
        with:
          file: GSBC.Accounting.Grpc/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=asherslab/gsbc-accounting-grpc:latest
          cache-to: type=inline
          push: true
          tags: asherslab/gsbc-accounting-grpc:latest,asherslab/gsbc-accounting-grpc:${{needs.version.outputs.version}}

  build-wasm:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push WASM
        uses: docker/build-push-action@v6
        with:
          file: GSBC.Accounting.WASM/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=asherslab/gsbc-accounting-wasm:latest
          cache-to: type=inline
          push: true
          tags: asherslab/gsbc-accounting-wasm:latest,asherslab/gsbc-accounting-wasm:${{needs.version.outputs.version}}

  build-yarp:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push YARP
        uses: docker/build-push-action@v6
        with:
          file: GSBC.Accounting.YARP/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=asherslab/gsbc-accounting-yarp:latest
          cache-to: type=inline
          push: true
          tags: asherslab/gsbc-accounting-yarp:latest,asherslab/gsbc-accounting-yarp:${{needs.version.outputs.version}}

  chart:
    needs:
      - version
    permissions:
      contents: write
      packages: write
      statuses: write
    uses: ./.github/workflows/chart-publish.yml
    with:
      version: ${{needs.version.outputs.version}}

  # Last, and it waits on the chart AND all four image builds on purpose. This is the step that tells
  # the cluster to move: pointing Argo at a chart version that is not in the Helm repo yet fails the
  # sync with "chart not found", and pointing it at images that are still building is a guaranteed
  # ImagePullBackOff.
  argo-update:
    secrets: inherit
    needs:
      - version
      - chart
      - build-migrations
      - build-grpc
      - build-wasm
      - build-yarp
    uses: ./.github/workflows/argo-repo-update.yml
    with:
      version: ${{needs.version.outputs.version}}
