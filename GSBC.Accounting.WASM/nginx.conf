# Static host for the published Blazor WebAssembly output. Lifted from GSBC.ImpactKids' nginx.conf,
# which had already paid for the two non-obvious parts below.
#
# This server is ClusterIP-only and is reached through YARP's catch-all route, never directly. It
# terminates nothing and authenticates nothing.
events { }
http {
    server_tokens off;

    # Cache-Control is keyed on whether the filename carries a content hash, NOT on where the file
    # lives. `dotnet.js` is the reason: it is the Blazor boot manifest, it lists the hashed name of
    # every other asset, and it keeps its literal name across every publish. Matching the whole of
    # /_framework/ as immutable - which this file did until 2026-09-01 - therefore pinned last
    # deploy's manifest in the browser for a year, and because everything that manifest names was
    # also cached immutable, the app booted entirely from cache. A deploy stayed invisible until the
    # user cleared their cache; reloading could not fix it, since index.html only ever references the
    # stable loader name and so never mentions a changed byte.
    #
    # So: hashed name -> a year. Everything else, index.html and css/app.css included -> revalidate.
    # That costs a handful of 304s per load on a site this size and removes the whole class of bug.
    #
    # There is no service worker in this app, so no service-worker.js entry: the browser fetches
    # index.html on every navigation and the no-cache above is the whole update story.
    #
    # `private` on the default is about Cloudflare, and it is the reason the 2026-09-01 fix above did
    # not hold. The zone's Browser Cache TTL is a fixed 4 hours rather than "Respect Existing Headers",
    # and that setting REWRITES Cache-Control on its way to the browser - but only on responses the
    # edge actually cached. Measured on 2026-09-01 against the deployed origin:
    #
    #   /_framework/dotnet.js               origin no-cache          -> edge max-age=14400   (MISS)
    #   /_framework/blazor.webassembly.js   origin no-cache          -> edge max-age=14400   (EXPIRED)
    #   /css/app.css, /favicon.png          origin no-cache          -> edge max-age=14400   (MISS)
    #   /index.html                         origin no-cache          -> edge no-cache        (DYNAMIC)
    #   *.<hash>.wasm                       origin immutable/1y      -> edge immutable/1y    (DYNAMIC)
    #
    # The split is not about our headers at all: it is Cloudflare's default static-extension list. .js,
    # .css and .png are on it and get cached and rewritten; .html and .wasm are not, are never cached,
    # and pass through untouched. Which lands the rewrite on exactly the two stable-named boot files
    # that must revalidate, and on nothing that benefits - so a deploy was invisible for four hours a
    # hop, twice over, while the 4.85 MB of immutable payload was not edge-cached at all.
    #
    # `private` marks these responses as belonging to a single user's cache, so Cloudflare - a SHARED
    # cache - declines to store them, and a response the edge never stored is a response whose
    # Cache-Control it never rewrites. The browser still caches them and still revalidates, so we keep
    # the 304s. This makes correctness a property of this file rather than of a dashboard toggle nobody
    # can see from the repo: fix Browser Cache TTL and this line costs nothing; regress it, and users
    # still get the new build. Do not "tidy" it away to a bare no-cache.
    map $uri $cache_control {
        default                            "private, no-cache";

        # Ten base-36 characters between the stem and the extension, as emitted by the SDK's asset
        # fingerprinting: GSBC.Accounting.WASM.s1e374kjf9.wasm, icudt_CJK.tjcz0u77k5.dat. The two
        # files under here that lack one - blazor.webassembly.js and dotnet.js - fall to the default
        # and are revalidated, which is exactly the point.
        # Quoted: an unquoted {10} is read as a block opener and nginx refuses to start.
        "~^/_framework/.+\.[0-9a-z]{10}\."  "public, max-age=31536000, immutable";

        ~\.woff2?$                         "public, max-age=31536000, immutable";
    }

    types {
        text/html                           html htm;
        text/css                            css;
        application/javascript              js mjs;
        application/json                    json;
        application/manifest+json           webmanifest;
        application/wasm                    wasm;
        text/plain                          txt;
        text/xml                            xml;
        application/octet-stream            bin dll exe pdb blat dat webcil;

        image/png                           png;
        image/jpeg                          jpg jpeg;
        image/gif                           gif;
        image/webp                          webp;
        image/avif                          avif;
        image/svg+xml                       svg;
        image/x-icon                        ico;

        font/woff                           woff;
        font/woff2                          woff2;

        application/octet-stream            *;
    }

    server {
        listen 80;

        # Fingerprinted runtime assets. These must NEVER fall back to index.html: a missing hash then
        # returns 200 text/html, the runtime fails its integrity check, and the user gets an opaque
        # "Load failed" instead of an obvious 404.
        location /_framework/ {
            root      /usr/share/nginx/html;
            try_files $uri =404;

            gzip_static on;

            # NO `always` on Cache-Control here, deliberately. With it, nginx attaches
            # "max-age=31536000, immutable" to the 404 as well, and Cloudflare then caches that 404
            # for a year against a stable filename — measured on 2026-08-31, when a bad publish gave
            # the loader a fingerprinted name: the origin was fixed and redeployed, and the edge kept
            # serving 404 (cf-cache-status: HIT, age: 857) until the cache was purged by hand.
            #
            # Without `always`, nginx adds the header only to 2xx/3xx, so a miss is never cacheable and
            # the next request re-asks the origin. nosniff keeps `always` — a wrong-typed error
            # response is exactly when it should still apply.
            add_header Cache-Control $cache_control;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location @spa {
            root /usr/share/nginx/html;

            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;

            try_files /index.html =404;
        }

        location / {
            root      /usr/share/nginx/html;

            # Client-side routing: serve the file if it exists, else hand back index.html so
            # /forms/expense-reimbursement resolves in the browser rather than 404ing here. No $uri/
            # in the list: a bare / would otherwise be answered by the index module with $uri still
            # "/", and the map would key on that instead of on the file actually being served.
            try_files $uri @spa;

            gzip_static on;

            # Same reasoning as the /_framework/ block: no `always`, so an error response is never
            # handed a long-lived caching header for the edge to keep.
            add_header Cache-Control $cache_control;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
