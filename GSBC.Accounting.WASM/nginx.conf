# Static host for the published Blazor WebAssembly output. Lifted from GSBC.ImpactKids' nginx.conf,
# which had already paid for the two non-obvious parts below.
#
# This server is ClusterIP-only and is reached through YARP's catch-all route, never directly. It
# terminates nothing and authenticates nothing.
events { }
http {
    server_tokens off;

    # index.html must not be cached or a deploy is invisible until someone hard-refreshes. The
    # fingerprinted runtime under /_framework/ is immutable by construction and cached for a year.
    #
    # There is no service worker in this app, so no service-worker.js entry: the browser fetches
    # index.html on every navigation and the no-cache above is the whole update story.
    map $uri $cache_control {
        default             "max-age=3600";
        /index.html         "no-cache";

        ~^/_framework/      "public, max-age=31536000, immutable";
        ~\.woff2?$          "public, max-age=31536000, immutable";
    }

    types {
        text/html                           html htm;
        text/css                            css;
        application/javascript              js mjs;
        application/json                    json;
        application/manifest+json           webmanifest;
        application/wasm                    wasm;
        text/plain                          txt;
        text/xml                            xml;
        application/octet-stream            bin dll exe pdb blat dat webcil;

        image/png                           png;
        image/jpeg                          jpg jpeg;
        image/gif                           gif;
        image/webp                          webp;
        image/avif                          avif;
        image/svg+xml                       svg;
        image/x-icon                        ico;

        font/woff                           woff;
        font/woff2                          woff2;

        application/octet-stream            *;
    }

    server {
        listen 80;

        # Fingerprinted runtime assets. These must NEVER fall back to index.html: a missing hash then
        # returns 200 text/html, the runtime fails its integrity check, and the user gets an opaque
        # "Load failed" instead of an obvious 404.
        location /_framework/ {
            root      /usr/share/nginx/html;
            try_files $uri =404;

            gzip_static on;

            # NO `always` on Cache-Control here, deliberately. With it, nginx attaches
            # "max-age=31536000, immutable" to the 404 as well, and Cloudflare then caches that 404
            # for a year against a stable filename — measured on 2026-08-31, when a bad publish gave
            # the loader a fingerprinted name: the origin was fixed and redeployed, and the edge kept
            # serving 404 (cf-cache-status: HIT, age: 857) until the cache was purged by hand.
            #
            # Without `always`, nginx adds the header only to 2xx/3xx, so a miss is never cacheable and
            # the next request re-asks the origin. nosniff keeps `always` — a wrong-typed error
            # response is exactly when it should still apply.
            add_header Cache-Control $cache_control;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            root      /usr/share/nginx/html;

            # Client-side routing: serve the file if it exists, else hand back index.html so
            # /forms/expense-reimbursement resolves in the browser rather than 404ing here.
            try_files $uri $uri/ /index.html =404;

            gzip_static on;

            # Same reasoning as the /_framework/ block: no `always`, so an error response is never
            # handed a long-lived caching header for the edge to keep.
            add_header Cache-Control $cache_control;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
